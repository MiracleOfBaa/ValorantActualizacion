version: '3.8'

services:
  app:
    image: php:8.2-fpm
    container_name: laravel_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - 8000:8000
    networks:
      - laravel
    build:
      context: .
      dockerfile: Dockerfile

  db:
    image: mysql:8.0
    container_name: laravel_db
    ports:
      - 3307:3306  # Cambia el puerto 3306 si hay conflicto con otro servicio
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: valorant
      MYSQL_USER: user
      MYSQL_PASSWORD: valorant
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 8081:80  # Puedes cambiar el puerto 8081 si hay conflicto
    networks:
      - laravel
    depends_on:
      - db

networks:
  laravel:
    driver: bridge
