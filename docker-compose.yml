version: '3.8'

services:
  app:
    image: php:8.1-fpm
    container_name: laravel_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - 8000:8000
    networks:
      - laravel

  webserver:
    image: nginx:latest
    container_name: laravel_webserver
    ports:
      - 8080:80
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: valorant
      MYSQL_USER: root
      MYSQL_PASSWORD:
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
